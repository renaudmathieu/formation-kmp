# Vérification de chaque checkpoint du dépôt de formation : le socle et chaque branche etape/* doivent
# compiler sur Android et iOS, et leurs tests doivent passer. Ce n'est pas le workflow pédagogique
# du module 13 (voir la branche etape/13-cicd, fichier ci.yml).
name: Vérification du checkpoint

on:
  push:
    branches: ["main", "etape/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android, tests et serveur (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Versions publiées (diagnostic)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-logs
          meta() { echo "== $1"; curl -fsSL "$1/maven-metadata.xml" | grep -oE '<version>[^<]+</version>' | sed -E 's/<\/?version>//g' | tail -n 12 | tr '\n' ' '; echo; }
          {
            meta https://repo1.maven.org/maven2/org/jetbrains/compose/material3/material3
            meta https://repo1.maven.org/maven2/org/jetbrains/compose/runtime/runtime
            meta https://repo1.maven.org/maven2/org/jetbrains/androidx/lifecycle/lifecycle-viewmodel-compose
            meta https://repo1.maven.org/maven2/io/insert-koin/koin-compose-viewmodel
            meta https://repo1.maven.org/maven2/com/shepeliev/webrtc-kmp
            meta https://repo1.maven.org/maven2/app/cash/turbine/turbine
            meta https://repo1.maven.org/maven2/co/touchlab/skie/gradle-plugin
            meta https://repo1.maven.org/maven2/io/ktor/ktor-client-core
            meta https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin
            meta https://dl.google.com/dl/android/maven2/androidx/activity/activity-compose
            meta https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle
            curl -fsSL https://services.gradle.org/versions/all | grep -oE '"version" : "9\.[0-9.]+"' | head -8
          } 2>&1 | tee ci-logs/versions.log
      - name: Build Android, tests communs (hôte Android) et serveur
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          TASKS=":androidApp:assembleDebug :shared:testAndroidHostTest :server:test"
          ./gradlew --continue --stacktrace $TASKS 2>&1 | tee ci-logs/android.log
      - name: Rapports de test
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs/reports
          find . -path '*/build/test-results/*' -name '*.xml' -exec cp {} ci-logs/reports/ \; 2>/dev/null || true
      - name: Publier les journaux
        if: always()
        uses: ./.github/actions/publish-logs
        with:
          job: android
          status: ${{ job.status }}

  ios:
    name: iOS (macOS, Xcode 26.4)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Projet Xcode (génération si absent)
        shell: bash
        run: |
          mkdir -p ci-logs
          xcodebuild -version | tee ci-logs/xcode-version.log
          if [ ! -d iosApp/iosApp.xcodeproj ]; then
            brew install xcodegen
            (cd iosApp && xcodegen generate) 2>&1 | tee ci-logs/xcodegen.log
            echo "generated" > ci-logs/xcodeproj-generated
          fi
      - name: Compilation Kotlin/Native
        shell: bash
        run: |
          set -o pipefail
          TASKS=":shared:compileKotlinIosSimulatorArm64"
          # À partir du module 12 : l'XCFramework (debug, pour rester rapide)
          if grep -q "XCFramework(" shared/build.gradle.kts; then TASKS="$TASKS :shared:assembleSharedDebugXCFramework"; fi
          ./gradlew --stacktrace $TASKS 2>&1 | tee ci-logs/kotlin-ios.log
      - name: Build de l'app iOS (simulateur)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ci-logs/xcodebuild.log
      - name: Erreurs Xcode
        if: failure()
        shell: bash
        run: |
          grep -E "error:|warning: Run script|BUILD FAILED|e: " ci-logs/xcodebuild.log | head -80 > ci-logs/xcode-errors.log || true
      - name: Publier les journaux
        if: always()
        uses: ./.github/actions/publish-logs
        with:
          job: ios
          status: ${{ job.status }}
          extra: iosApp/iosApp.xcodeproj
