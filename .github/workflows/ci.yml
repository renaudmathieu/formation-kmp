# Module 13 : le pipeline pédagogique. Deux mondes de build pour un même dépôt :
# Linux pour Android et les tests communs, macOS pour iOS.
name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6   # cache Gradle (licence propre à la v6 : voir pièges)
      # commonTest tourne sous Linux via les tests hôtes Android (withHostTest, module 5)
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:testDebugUnitTest

  ios-build:
    if: github.ref == 'refs/heads/main'          # minutes macOS coûteuses : branche principale seulement
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'               # version du registre de fraîcheur
      - uses: gradle/actions/setup-gradle@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true                   # installe Fastlane via le Gemfile
      - run: ./gradlew :shared:linkReleaseFrameworkIosArm64
      - run: bundle exec fastlane ios build     # gym pour l'archive, Match pour les certificats
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
