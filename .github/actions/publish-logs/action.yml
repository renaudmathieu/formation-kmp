# Publie les journaux d'un job sous une référence Git dédiée (refs/ci/…), lisible avec
#   git fetch origin 'refs/ci/*:refs/ci/*'
# Ne crée pas de branche visible. Utilisé par verify.yml uniquement.
name: Publier les journaux de CI
inputs:
  job:
    required: true
  status:
    required: true
  extra:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        JOB: ${{ inputs.job }}
        STATUS: ${{ inputs.status }}
        EXTRA: ${{ inputs.extra }}
      run: |
        set +e
        REF_NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
        OUT=$(mktemp -d)
        mkdir -p ci-logs
        cp -R ci-logs/. "$OUT/"
        if [ -n "$EXTRA" ] && [ -e "$EXTRA" ]; then mkdir -p "$OUT/extra" && cp -R "$EXTRA" "$OUT/extra/"; fi
        printf 'job=%s\nstatus=%s\nsha=%s\nrun=%s\n' "$JOB" "$STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$OUT/STATUS"
        cd "$OUT"
        git init -q
        git config user.name "ci"
        git config user.email "ci@users.noreply.github.com"
        git add -A
        git commit -qm "$JOB $STATUS $GITHUB_SHA"
        URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git push -qf "$URL" "HEAD:refs/ci/${REF_NAME}/${JOB}" || git push -qf "$URL" "HEAD:refs/heads/ci-logs/${REF_NAME}/${JOB}"
        exit 0
